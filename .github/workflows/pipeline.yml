name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 on api
        run: flake8 api/main.py --max-line-length=100

      - name: Run flake8 on worker
        run: flake8 worker/worker.py --max-line-length=100

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run eslint on frontend
        working-directory: frontend
        run: npx eslint app.js --env node --env es2021 --rule '{"no-unused-vars": "warn"}' || npx eslint app.js

      - name: Lint api Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

      - name: Lint worker Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: worker/Dockerfile

      - name: Lint frontend Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install api dependencies and test tools
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run pytest with coverage
        working-directory: api
        run: pytest tests/ --cov=. --cov-report=xml --cov-report=term -v

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Set short SHA tag
        run: echo "SHA=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Cache Docker layers for api
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-api
          key: ${{ runner.os }}-buildx-api-${{ hashFiles('api/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-api-

      - name: Cache Docker layers for worker
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-worker
          key: ${{ runner.os }}-buildx-worker-${{ hashFiles('worker/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-worker-

      - name: Cache Docker layers for frontend
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache-frontend
          key: ${{ runner.os }}-buildx-frontend-${{ hashFiles('frontend/**') }}
          restore-keys: |
            ${{ runner.os }}-buildx-frontend-

      - name: Build and push api image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            localhost:5000/api:${{ env.SHA }}
            localhost:5000/api:latest
          cache-from: type=local,src=/tmp/.buildx-cache-api
          cache-to: type=local,dest=/tmp/.buildx-cache-api-new,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            localhost:5000/worker:${{ env.SHA }}
            localhost:5000/worker:latest
          cache-from: type=local,src=/tmp/.buildx-cache-worker
          cache-to: type=local,dest=/tmp/.buildx-cache-worker-new,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            localhost:5000/frontend:${{ env.SHA }}
            localhost:5000/frontend:latest
          cache-from: type=local,src=/tmp/.buildx-cache-frontend
          cache-to: type=local,dest=/tmp/.buildx-cache-frontend-new,mode=max

      - name: Rotate build cache for api
        run: |
          rm -rf /tmp/.buildx-cache-api
          mv /tmp/.buildx-cache-api-new /tmp/.buildx-cache-api

      - name: Rotate build cache for worker
        run: |
          rm -rf /tmp/.buildx-cache-worker
          mv /tmp/.buildx-cache-worker-new /tmp/.buildx-cache-worker

      - name: Rotate build cache for frontend
        run: |
          rm -rf /tmp/.buildx-cache-frontend
          mv /tmp/.buildx-cache-frontend-new /tmp/.buildx-cache-frontend

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build api image for scanning
        run: docker build -t scan/api:latest ./api

      - name: Build worker image for scanning
        run: docker build -t scan/worker:latest ./worker

      - name: Build frontend image for scanning
        run: docker build -t scan/frontend:latest ./frontend

      - name: Scan api image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan/api:latest
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL
          exit-code: "1"

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan/worker:latest
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: scan/frontend:latest
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: "*.sarif"

  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create env file from example
        run: cp .env.example .env

      - name: Make integration script executable
        run: chmod +x integration.sh

      - name: Run integration test script
        run: bash integration.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rolling deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: hngdevops
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/hng14-stage2-devops
            git pull origin main
            docker compose build

            for service in api worker frontend; do
              echo "==> Rolling update: $service"
              docker compose up -d --no-deps --build $service

              NEW_ID=$(docker compose ps -q $service | head -1)
              timeout 60 bash -c "
                until docker inspect --format='{{.State.Health.Status}}' $NEW_ID \
                  2>/dev/null | grep -q 'healthy'; do
                  sleep 3
                done
              " || {
                echo "Health check failed for $service — aborting"
                exit 1
              }
              echo "$service updated successfully"
            done